name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find and install dependencies
        run: |
          if [ -f package.json ]; then
            echo "Found package.json at root"
            npm install
          elif [ -f app/package.json ]; then
            echo "Found package.json in app/"
            cd app && npm install
          else
            echo "Searching for package.json..."
            find . -name "package.json" -not -path "*/node_modules/*" | head -5
          fi

      - name: Build Docker image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t getting-started-todo-app .
          elif [ -f app/Dockerfile ]; then
            docker build -t getting-started-todo-app ./app
          else
            echo "No Dockerfile found, skipping Docker build"
          fi
